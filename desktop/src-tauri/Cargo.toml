[package]
name = "galleryweb-desktop"
version = "1.1.1"
description = "GalleryWeb — yerel fotoğraf galerisi masaüstü uygulaması"
authors = ["ihsandeniz"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
