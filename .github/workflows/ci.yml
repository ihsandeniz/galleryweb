name: CI

on:
  push:
    branches: [main, develop, 'faz-w**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # her Pazartesi 06:00 UTC — dependency-scan için

jobs:
  pip-audit:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # 2026-08-07: hedef `requirements.txt` idi — yani KULLANILMAYAN bulut/SaaS
      # bağımlılıkları denetleniyor, yayınlanan ürününkiler denetlenmiyordu.
      # SaaS katmanı kaldırıldı; denetim artık gerçekten paketlenen dosyada.
      - name: Run pip-audit
        run: pip-audit -r backend/requirements-selfhost.txt

  yerel-test:
    name: Yerel mod testleri (${{ matrix.os }})
    # Aynı test paketi iki işletim sisteminde de koşar. FAZ W'nin çekirdek fikri
    # bu: "Windows'ta sessizce yanlış" hataları ancak GERÇEK Windows'ta görünür,
    # statik denetim ve Linux CI ikisi de onları kaçırıyordu.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # 2026-08-07: `cache: pip` varsayılan olarak **/requirements.txt arar.
          # SaaS katmanıyla birlikte o dosya silindiği için hiçbir şey eşleşmedi
          # ve setup-python adımı hata verdi (yerelde görünmeyen, CI'ya özel kusur).
          cache-dependency-path: backend/requirements-selfhost.txt

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-selfhost.txt
          pip install pytest httpx

      - name: Uzun yol desteğini aç (Windows)
        if: runner.os == 'Windows'
        # Test 260 karakterden UZUN yollar kuruyor. `\\?\` öneki uygulamanın
        # kendi kodunda var; bu ayar test fikstürlerinin (git checkout, temizlik)
        # aynı sınıra takılmaması için.
        run: git config --system core.longpaths true

      - name: Testler
        run: python -m pytest tests/ -v --tb=short

      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: |
          pip install ruff
          ruff check backend/ --ignore E501 || true

  windows-paket:
    name: Windows paketi (exe + kurulum)
    needs: yerel-test
    runs-on: windows-latest
    # W0'ın asıl amacı: Windows paketi ihsan'ın makinesinde değil, burada üretilsin.
    # `yap.ps1` CI'da da kullanıcıdakiyle AYNI betiktir — betiğin kendisi de sınanır.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sunucu paketi (PyInstaller · onedir)
        run: .\desktop\yap.ps1 sunucu

      - name: Paket duman testi (gerçek exe çalıştırılır)
        run: |
          pip install Pillow
          python tests\paket_duman_testi.py desktop\dist\galleryweb-server\galleryweb-server.exe

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: cargo-tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Masaüstü uygulaması + NSIS kurulumu
        run: |
          cd desktop\src-tauri
          cargo tauri build

      - name: Kurulum paketinin içeriğini doğrula
        # Tauri'nin kaynak eşlemesi sessizce değişebilir (`_up_/dist/…` dersi,
        # 2026-07-26). Kurulumu açıp sunucu exe'sinin GERÇEKTEN paketlendiğini
        # doğrulamazsak, "derleme başarılı" diyen yeşil bir CI ile açılmayan bir
        # uygulama yan yana yaşayabilir.
        shell: pwsh
        run: |
          $nsis = Get-ChildItem desktop\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $nsis) { throw "NSIS kurulum paketi üretilmedi" }
          Write-Host "Kurulum paketi: $($nsis.FullName) ($([math]::Round($nsis.Length/1MB,1)) MB)"
          & 7z x $nsis.FullName -o"$env:RUNNER_TEMP\nsis-ac" -y | Out-Null
          $sunucu = Get-ChildItem "$env:RUNNER_TEMP\nsis-ac" -Recurse -Filter galleryweb-server.exe
          if (-not $sunucu) { throw "galleryweb-server.exe kurulum paketinde YOK — kaynak eşlemesi bozuk" }
          Write-Host "✓ sunucu paketin içinde: $($sunucu[0].FullName)"
          $ic = Get-ChildItem (Split-Path $sunucu[0].FullName) -Filter _internal -Directory
          if (-not $ic) { throw "_internal klasörü yok — onedir düzeni bozuk" }
          Write-Host "✓ onedir düzeni sağlam"

      - name: Windows paketlerini yükle
        uses: actions/upload-artifact@v4
        with:
          name: galleryweb-windows
          retention-days: 30
          # 2026-08-07: burada ikinci bir yol daha vardı —
          # `desktop/src-tauri/target/release/GalleryWeb.exe`. **Hiçbir zaman
          # eşleşmedi:** Tauri ikiliyi `productName` ile değil Cargo paket adıyla
          # bırakıyor → `galleryweb-desktop.exe`. Varsayılan `if-no-files-found: warn`
          # olduğu için koşu yıllarca yeşil kaldı, artifact eksik üretildi.
          # Yol düzeltilmedi, KALDIRILDI: tek başına exe zaten kullanılabilir bir
          # çıktı değil — sunucuyu `resource_dir()` altında arar, kurulum paketi
          # dışında bulamaz (src-tauri/src/main.rs `resolve_server_binary`).
          # Teslim edilen şey kurulum paketidir.
          if-no-files-found: error   # sessiz eksik yükleme bir daha olmasın
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  linux-paket:
    name: Linux paketi (deb + AppImage)
    needs: yerel-test
    # ⚠️ `ubuntu-latest` DEĞİL — sürüm bilerek sabit. Bir Linux paketi, derlendiği
    # makinenin glibc'ini TABAN alır ve daha eskisinde açılmaz. v1.1.0'da AppImage
    # tam bu yüzden yayınlanamadı: ihsan'ın Arch makinesinde (glibc 2.44) derlendiği
    # için gömülü kütüphaneler GLIBC_2.43 istiyordu, hiçbir LTS'te açılmıyordu.
    # jammy = glibc 2.35 → Ubuntu 22.04+ ve Debian 12+ kapsanır.
    # Bu etiket emekliye ayrılırsa: bir üst LTS'e geç ve `linux_paket_dogrula.sh`
    # içindeki GLIBC_TABANI + hedef kabı birlikte güncelle — yoksa doğrulama
    # işi kırmızıya döner (kasıtlı: sessizce taban yükseltmesin).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sistem bağımlılıkları (Tauri v2 + AppImage medya çerçevesi)
        # gstreamer paketleri `bundleMediaFramework: true` içindir — AppImage'a
        # video oynatma eklentilerini linuxdeploy DERLEME makinesinden kopyalar,
        # yoksa video sessizce çalışmaz. patchelf o eklentinin ön koşulu.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf desktop-file-utils file \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: cargo-tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Paketleri derle (kullanıcıdakiyle AYNI betik)
        # `yap.ps1 sunucu` Windows'ta ne ise `yap.sh` burada odur: betiğin kendisi
        # de sınanır, CI'ya özel ikinci bir derleme yolu doğmaz.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runner'da FUSE garanti değil
        run: ./desktop/yap.sh

      - name: Paket duman testi (gerçek sunucu ikilisi çalıştırılır)
        run: |
          pip install Pillow
          python tests/paket_duman_testi.py desktop/dist/galleryweb-server

      - name: Eski glibc doğrulaması (Debian 12 kabında kurulur + koşturulur)
        # "Derleme başarılı" yeşil bir CI ile açılmayan bir paket yan yana
        # yaşayabilir — v1.1.0'da tam olarak bu oldu. Doğrulama artefaktı
        # vaat ettiğimiz EN ESKİ dağıtımın içinde açar. Detay: betiğin başlığı.
        run: ./tests/linux_paket_dogrula.sh desktop/src-tauri/target/release/bundle

      - name: Linux paketlerini yükle
        uses: actions/upload-artifact@v4
        with:
          name: galleryweb-linux
          retention-days: 30
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  gizlilik:
    name: Gizlilik — dışarı istek gidiyor mu
    runs-on: ubuntu-latest
    # Bu projenin ürün vaadi tek cümle: "fotoğraflarınla ilgili hiçbir şey dışarı
    # gitmez". O vaadi şimdiye kadar CI ölçmüyordu — yalnız elle koşulan bir betik
    # vardı. Bir CDN linki (font/Leaflet/harita altlığı) geri sızarsa fark edilmesi
    # gereken yer burasıdır: sızıntı kod hatası gibi görünmez, sessizce çalışır.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-selfhost.txt

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-selfhost.txt playwright
          playwright install --with-deps chromium

      - name: Fotoğraf klasörü hazırla
        # Klasör seçilmemişse harita görünümü hiç açılmaz ve test "sıfır dış
        # istek" diyerek BOŞA geçer. Ölçümün anlamlı olması için gerçek bir
        # fotoğraf gerekiyor — üstelik GPS EXIF'li, çünkü sızıntının asıl
        # olduğu yer harita altlığının koordinatları OSM'e bildirmesiydi.
        run: python tests/gizlilik_fikstur.py "$RUNNER_TEMP/foto"

      - name: Sunucuyu başlat
        run: |
          cd backend && PORT=5099 python main.py > "$RUNNER_TEMP/sunucu.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5099/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5099/ >/dev/null || { cat "$RUNNER_TEMP/sunucu.log"; exit 1; }
          curl -sf -X POST http://127.0.0.1:5099/api/set-directory \
            -H 'Content-Type: application/json' \
            -d "{\"path\": \"$RUNNER_TEMP/foto\"}" >/dev/null

      - name: Sızıntı testi
        env:
          GW_BASE: http://127.0.0.1:5099
        run: python tests/gizlilik_sizinti_testi.py

      - name: Sunucu günlüğü (hata hâlinde)
        if: failure()
        run: cat "$RUNNER_TEMP/sunucu.log" || true

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JavaScript sözdizimi
        run: |
          for f in frontend/js/*.js; do node --check "$f"; done
          echo "✓ tüm JS dosyaları geçerli"
